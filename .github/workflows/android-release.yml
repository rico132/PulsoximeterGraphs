name: Build and release APK

# Builds the Android debug APK and publishes it as a GitHub release on every push to main
# (or on manual trigger). The version tag is computed automatically and is always a 0.x.y
# tag — this workflow will never create or touch a 1.0.0+ tag. Once the app is ready for a
# real 1.0.0, that release should be tagged/published by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs so two pushes in quick succession can't race on the same version number.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history to compute the next version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      # Only ever considers existing v0.x.y tags, so a manually created v1.0.0 (or higher)
      # tag is invisible to this bump — the automated series stays on 0.x.y forever.
      - name: Compute next pre-1.0 version
        id: version
        run: |
          git fetch --tags --force
          latest=$(git tag --list 'v0.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Previous tag: ${latest:-<none>}; next: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./android/build.sh assembleDebug --no-daemon

      - name: Rename APK for release
        id: apk
        run: |
          version="${{ steps.version.outputs.version }}"
          src="android/app/build/outputs/apk/debug/app-debug.apk"
          dest="android/app/build/outputs/apk/debug/PulsoximeterGraphs-${version}.apk"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
