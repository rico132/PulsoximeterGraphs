name: Build and release APK

# Builds the Android release APK, signed with the fixed keystore in the RELEASE_KEYSTORE_*
# secrets (see build.gradle.kts), and publishes it as a GitHub release on every push to main
# (or on manual trigger). The version tag is computed automatically and is always a 0.x.y
# tag — this workflow will never create or touch a 1.0.0+ tag. Once the app is ready for a
# real 1.0.0, that release should be tagged/published by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs so two pushes in quick succession can't race on the same version number.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history to compute the next version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      # Only ever considers existing v0.x.y tags, so a manually created v1.0.0 (or higher)
      # tag is invisible to this bump — the automated series stays on 0.x.y forever.
      - name: Compute next pre-1.0 version
        id: version
        run: |
          git fetch --tags --force
          latest=$(git tag --list 'v0.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Previous tag: ${latest:-<none>}; next: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "version_name=${next#v}" >> "$GITHUB_OUTPUT"

      # Decode the release keystore from its base64 secret into a file outside the repo/workspace
      # tree, so every release is signed with the same certificate — required for Android to
      # accept an update over whatever's already installed (see build.gradle.kts for why this
      # replaced building assembleDebug, whose signing key was regenerated fresh on every run).
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/release.keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          echo "RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      # versionName matches the release tag (minus the leading "v"); versionCode just needs
      # to strictly increase build-over-build, which the workflow run number already does.
      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./android/build.sh assembleRelease --no-daemon
          -PappVersionName=${{ steps.version.outputs.version_name }}
          -PappVersionCode=${{ github.run_number }}

      - name: Rename APK for release
        id: apk
        run: |
          version="${{ steps.version.outputs.version }}"
          src="android/app/build/outputs/apk/release/app-release.apk"
          dest="android/app/build/outputs/apk/release/PulsoximeterGraphs-${version}.apk"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
