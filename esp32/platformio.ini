; PlatformIO project for the PulsoxRelay ESP32-S3 firmware.
;
; See PROTOCOL.md (repo root) for the fixed BLE/CSV wire contract and
; /home/agent/.claude/plans/i-want-an-kotlin-foamy-melody.md for the full
; implementation plan this firmware follows.

[platformio]
default_envs = esp32-s3-devkitc-1

; ---------------------------------------------------------------------------
; Alternate hardware target: Espressif ESP32-S3-USB-OTG (USB Host port with a
; MIC2005A-switched, GPIO17-enabled 5V/500mA VBUS output — the "one cable
; charges + carries data" requirement; see the plan's hardware section).
; ---------------------------------------------------------------------------
[env:esp32-s3-usb-otg]
platform = espressif32@7.0.1
board = esp32s3usbotg
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Replaces the board's stock default_8MB.csv (app0/app1 3.19MB each, spiffs
; only 1.5MB) — see partitions_8MB.csv's own header comment for why: a real
; PO-400 session was seen needing ~1.57MB of CSV rows, more than stock spiffs
; could ever hold. Shrinks each app slot to 2MB (this firmware is ~1.1MB) to
; grow spiffs/littlefs to ~3.87MB instead.
board_build.partitions = partitions_8MB.csv
; PSRAM is required for RamCsvBuffer's arena — sized dynamically from
; whatever PSRAM is actually free at boot (see RamCsvBuffer::begin()'s
; comment), not a fixed byte count; confirm the exact board revision
; purchased includes it per the plan's risk note — FileCsvBuffer is the
; LittleFS fallback if not.
; memory_type must be qio_qspi, not qio_opi: this board's own arduino-esp32
; boards.txt entry (esp32s3usbotg.build.memory_type) pins qio_qspi, i.e. its
; module has Quad SPI PSRAM, not Octal — qio_opi (Octal PSRAM timing) was
; wrong here and would misconfigure the PSRAM controller.
board_build.arduino.memory_type = qio_qspi
build_flags =
    -D BOARD_HAS_PSRAM
    -D HAS_USB_HOST_VBUS_SWITCH ; this board drives VBUS via GPIO17/MIC2005A
    ; NimBLE-Arduino's default of 12 (nimconfig.h's CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT)
    ; is a pool of pre-allocated RX buffers for incoming ACL packets from the BLE controller —
    ; see BleGattServer.cpp's Firmware-characteristic comment for why writes now arrive back-to-
    ; back rather than paced by a round trip. A real device logged "Failed to allocate buffer,
    ; retrying" (esp_nimble_hci.c) repeatedly during a firmware push at the default count: the
    ; phone's queued writes outran how fast this pool drained (each drain gated on this
    ; firmware's own synchronous Update::write() call finishing). Not fatal — that path just
    ; busy-waits in a retry loop until a buffer frees up — but 32 gives a much larger burst
    ; headroom before hitting it at all, for a modest, one-time RAM cost (~255 bytes/buffer).
    -D CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=32
    -std=gnu++17
build_unflags =
    -std=gnu++11
; NOTE: tanakamasayuki/EspUsbHost was tried first per the plan, but its only
; available release (2.7.7) fails to compile against this platform version's
; bundled ESP-IDF USB-host headers (see UsbHidOxHost.h's header comment for
; the exact undefined-symbol errors) — so USB host support is implemented
; directly against ESP-IDF's usb_host.h instead (arduino-esp32 exposes it
; since the core is itself built as an IDF component), per the plan's
; explicit fallback clause.
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
    tzapu/WiFiManager@^2.0.17
test_ignore = test_clock_sync, test_stored_record_downloader, test_csv_row_formatter

; ---------------------------------------------------------------------------
; Hardware target: a plain ESP32-S3-DevKitC-1. Its native USB-OTG port has no
; onboard VBUS switch, so it can't power the PO-400 itself — VBUS must
; instead be supplied externally, e.g. via a USB Y power/data splitter cable
; (power-only leg + data leg from this board's native USB port, merged into
; one connector into the PO-400). HAS_USB_HOST_VBUS_SWITCH is deliberately
; NOT defined here, so UsbHidOxHost skips the GPIO17 drive that only makes
; sense on the ESP32-S3-USB-OTG board. Everything else (USB host
; enumeration, HID report exchange, BLE relay) is board-agnostic and shared
; with the env above.
; ---------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Same custom table as esp32-s3-usb-otg above — same 8MB flash size, same
; reasoning (see partitions_8MB.csv).
board_build.partitions = partitions_8MB.csv
; Assumes a module with Quad SPI PSRAM (e.g. ESP32-S3-WROOM-1-Nxx**R8**/R2) —
; the WROOM-1 family, not WROOM-2's Octal PSRAM. If a different module is
; used, confirm its PSRAM bus width and adjust memory_type accordingly
; (qio_opi for Octal PSRAM, opi_opi if the flash is also Octal).
board_build.arduino.memory_type = qio_qspi
build_flags =
    -D BOARD_HAS_PSRAM
    ; See the matching flag/comment in the esp32-s3-usb-otg env above — same reasoning, same
    ; BLE stack, same exposure.
    -D CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=32
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
    tzapu/WiFiManager@^2.0.17
test_ignore = test_clock_sync, test_stored_record_downloader, test_csv_row_formatter

; ---------------------------------------------------------------------------
; Hardware-independent unit tests (ClockSync and the pure StoredRecordDecode
; nibble-decoding algorithm) — no Arduino/IDF, no board, no USB/BLE hardware
; required. Run with `pio test -e native`.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -Wall
build_src_filter =
    +<*>
    -<main.cpp>
    -<UsbHidOxHost.cpp>
    -<BleGattServer.cpp>
    -<BleFirmwareUpdater.cpp>
    -<OtaManager.cpp>
    -<OtaRollbackGuard.cpp>
    -<RamCsvBuffer.cpp>
    -<FileCsvBuffer.cpp>
    -<RomPrintfLock.cpp>
test_ignore = test_stored_record_downloader_hw
